spring:
  application:
    name: get_jobs
  profiles:
    active: dev
  info:
    app:
      name: Get Jobs
      version: 2.0.1
      description: AI 求职助手，支持岗位筛选、AI 匹配与投递管理
  banner:
    charset: UTF-8
    location: classpath:banner.txt
  datasource:
    url: jdbc:sqlite:./db/getjobs.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
      connection-test-query: SELECT 1
  sql:
    init:
      mode: never  # 数据库文件已存在，不需要自动初始化
  output:
    ansi:
      enabled: always

# 服务器配置
server:
  address: 127.0.0.1
  port: 9527  # 后端 API 固定端口（别用 9679：落在 Windows Hyper-V 保留段 9628-9727 里，绑不上）

playwright:
  # 按需启用平台，多个平台用逗号分隔：boss,liepin,51job,zhilian
  startup-platforms: ${GETJOBS_STARTUP_PLATFORMS:boss}

# Local safeguards, not platform-published safe thresholds. Budgets survive login/restart.
boss:
  safety:
    browse-interval-seconds: 15
    # A zero budget disables the corresponding hourly or daily limit.
    max-browse-per-hour: 0
    max-browse-per-day: 0
    # Zero disables repeated-search cooldown; the browsing interval still applies.
    search-cooldown-minutes: 0
    detail-cache-hours: 6

# 日志配置
logging:
  level:
    root: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]){magenta} %clr(%-5level){highlight} %clr(%logger{36}){cyan} %clr(-){faint} %msg%n"
  file:
    name: ./target/logs/get-jobs.log
  logback:
    rollingpolicy:
      max-history: 30
      max-file-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: true  # 打开 MyBatis Plus 启动 banner
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml
